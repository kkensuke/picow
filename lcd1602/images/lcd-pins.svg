<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" role="img"><title>液晶の裏側のピンと Pico W 側の接続先</title><desc>液晶の裏に付いた I2C 基板の端に GND, VCC, SDA, SCL の順にピンが並び、それぞれを Pico W の上側のピンを USB 側から数えた順番の列につなぐ。基板上には、コントラストを調整する青いつまみと、バックライトのジャンパーがある。部品の位置は模式的</desc><style>text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif;fill:#2C2C2A}.t{font-size:14px}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600}.mono{font-family:'SFMono-Regular',Menlo,Consolas,'Noto Sans Mono CJK JP',monospace;font-size:13px}.c{dominant-baseline:central}.m{text-anchor:middle}.e{text-anchor:end}</style><rect x="0.5" y="0.5" width="679" height="259" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/><text class="ts c" x="40" y="24">液晶の裏側（I2C 基板が付いた面）</text><text class="ts c" x="478" y="24">Pico W 側（USB から数えた順番）</text><rect x="40" y="40" width="380" height="200" rx="8" fill="#0F6E56"/><circle cx="58" cy="58" r="8" fill="#F1EFE8"/><circle cx="58" cy="222" r="8" fill="#F1EFE8"/><circle cx="402" cy="58" r="8" fill="#F1EFE8"/><circle cx="402" cy="222" r="8" fill="#F1EFE8"/><rect x="200" y="62" width="200" height="156" rx="4" fill="#2C2C2A"/><rect x="215" y="74" width="40" height="40" rx="4" fill="#378ADD"/><circle cx="235" cy="94" r="12" fill="#E6F1FB"/><line x1="235" y1="86" x2="235" y2="102" stroke="#378ADD" stroke-width="3" stroke-linecap="round"/><text class="ts m c" x="235" y="128" style="fill:#F1EFE8">コントラスト</text><rect x="222" y="150" width="80" height="36" rx="3" fill="#444441"/><text class="mono m c" x="262" y="168" style="fill:#F1EFE8">PCF8574</text><rect x="326" y="163" width="10" height="10" fill="#D3D1C7"/><rect x="340" y="163" width="10" height="10" fill="#D3D1C7"/><rect x="323" y="159" width="30" height="18" rx="3" fill="none" stroke="#F1EFE8" stroke-width="1.5"/><text class="ts m c" x="338" y="198" style="fill:#F1EFE8">バックライト</text><rect x="401" y="95" width="10" height="10" fill="#B4B2A9"/><text class="ts e c" x="392" y="100" style="fill:#F1EFE8">GND</text><line x1="416" y1="100" x2="462" y2="100" stroke="#888780" stroke-width="3" stroke-linecap="round"/><text class="t c" x="478" y="100">3 番目（GND）</text><rect x="401" y="121" width="10" height="10" fill="#B4B2A9"/><text class="ts e c" x="392" y="126" style="fill:#F1EFE8">VCC</text><line x1="416" y1="126" x2="462" y2="126" stroke="#E24B4A" stroke-width="3" stroke-linecap="round"/><text class="t c" x="478" y="126">1 番目（VBUS）</text><rect x="401" y="147" width="10" height="10" fill="#B4B2A9"/><text class="ts e c" x="392" y="152" style="fill:#F1EFE8">SDA</text><line x1="416" y1="152" x2="462" y2="152" stroke="#1D9E75" stroke-width="3" stroke-linecap="round"/><text class="t c" x="478" y="152">10 番目（GP26）</text><rect x="401" y="173" width="10" height="10" fill="#B4B2A9"/><text class="ts e c" x="392" y="178" style="fill:#F1EFE8">SCL</text><line x1="416" y1="178" x2="462" y2="178" stroke="#378ADD" stroke-width="3" stroke-linecap="round"/><text class="t c" x="478" y="178">9 番目（GP27）</text></svg>