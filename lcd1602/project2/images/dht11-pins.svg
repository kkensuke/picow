<svg xmlns="http://www.w3.org/2000/svg" width="680" height="457" viewBox="0 0 680 457" role="img"><title>DHT11 のピンと Pico W 側の接続先</title><desc>穴の開いた面を手前、ピンを下にして見た DHT11。4 本のピンは左から 1 番（VCC）、2 番（DATA）、3 番（NC）、4 番（GND）。1、2、4 番にワイヤーの穴側をかぶせ、それぞれ Pico W の 36 番ピン（3V3(OUT)）、21 番ピン（GP16）、23 番ピン（GND）につなぐ。3 番には何もつながない。黒い四角はワイヤーの穴側（メス）。穴の並びは模式的</desc><style>text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif;fill:#2C2C2A}.t{font-size:14px}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600}.c{dominant-baseline:central}.m{text-anchor:middle}</style><rect x="0.5" y="0.5" width="679" height="456" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/><text class="ts c" x="40" y="24">DHT11（穴の開いた面を手前に、ピンを下にして見た図）</text><rect x="90" y="44" width="161" height="207" rx="6" fill="#85B7EB" stroke="#378ADD" stroke-width="1.5"/><rect x="121" y="70" width="14" height="14" rx="3" fill="#185FA5"/><rect x="149" y="70" width="14" height="14" rx="3" fill="#185FA5"/><rect x="177" y="70" width="14" height="14" rx="3" fill="#185FA5"/><rect x="205" y="70" width="14" height="14" rx="3" fill="#185FA5"/><rect x="121" y="98" width="14" height="14" rx="3" fill="#185FA5"/><rect x="149" y="98" width="14" height="14" rx="3" fill="#185FA5"/><rect x="177" y="98" width="14" height="14" rx="3" fill="#185FA5"/><rect x="205" y="98" width="14" height="14" rx="3" fill="#185FA5"/><rect x="121" y="126" width="14" height="14" rx="3" fill="#185FA5"/><rect x="149" y="126" width="14" height="14" rx="3" fill="#185FA5"/><rect x="177" y="126" width="14" height="14" rx="3" fill="#185FA5"/><rect x="205" y="126" width="14" height="14" rx="3" fill="#185FA5"/><rect x="121" y="154" width="14" height="14" rx="3" fill="#185FA5"/><rect x="149" y="154" width="14" height="14" rx="3" fill="#185FA5"/><rect x="177" y="154" width="14" height="14" rx="3" fill="#185FA5"/><rect x="205" y="154" width="14" height="14" rx="3" fill="#185FA5"/><rect x="121" y="182" width="14" height="14" rx="3" fill="#185FA5"/><rect x="149" y="182" width="14" height="14" rx="3" fill="#185FA5"/><rect x="177" y="182" width="14" height="14" rx="3" fill="#185FA5"/><rect x="205" y="182" width="14" height="14" rx="3" fill="#185FA5"/><rect x="121" y="210" width="14" height="14" rx="3" fill="#185FA5"/><rect x="149" y="210" width="14" height="14" rx="3" fill="#185FA5"/><rect x="177" y="210" width="14" height="14" rx="3" fill="#185FA5"/><rect x="205" y="210" width="14" height="14" rx="3" fill="#185FA5"/><rect x="117" y="251" width="4" height="54" fill="#B4B2A9"/><text class="c" x="126" y="265" style="font-size:13px;font-weight:600;fill:#185FA5">1</text><rect x="151" y="251" width="4" height="54" fill="#B4B2A9"/><text class="c" x="160" y="265" style="font-size:13px;font-weight:600;fill:#185FA5">2</text><rect x="185" y="251" width="4" height="54" fill="#B4B2A9"/><text class="c" x="194" y="265" style="font-size:13px;font-weight:600;fill:#185FA5">3</text><rect x="219" y="251" width="4" height="54" fill="#B4B2A9"/><text class="c" x="228" y="265" style="font-size:13px;font-weight:600;fill:#185FA5">4</text><rect x="306" y="132" width="12" height="30" rx="2" fill="#444441"/><text class="t c" x="330" y="147">ワイヤーの穴側（メス）</text><text class="ts m c" x="338" y="309">DHT11 のピン</text><text class="ts c" x="456" y="309">Pico W 側（物理ピン番号）</text><path d="M221 319 L221 337 L300 337" fill="none" stroke="#888780" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="215" y="289" width="12" height="30" rx="2" fill="#444441"/><rect x="300" y="323" width="76" height="28" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="1.5"/><text class="th m c" x="338" y="337">4 GND</text><line x1="376" y1="337" x2="440" y2="337" stroke="#888780" stroke-width="3" stroke-linecap="round"/><text class="t c" x="456" y="337">23 番ピン（GND）</text><rect x="300" y="353" width="76" height="28" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="4 3"/><text class="th m c" x="338" y="367" style="fill:#5F5E5A">3 NC</text><text class="t c" x="456" y="367" style="fill:#5F5E5A">つながない</text><path d="M153 319 L153 397 L300 397" fill="none" stroke="#7F77DD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="147" y="289" width="12" height="30" rx="2" fill="#444441"/><rect x="300" y="383" width="76" height="28" rx="6" fill="#FFFFFF" stroke="#7F77DD" stroke-width="1.5"/><text class="th m c" x="338" y="397">2 DATA</text><line x1="376" y1="397" x2="440" y2="397" stroke="#7F77DD" stroke-width="3" stroke-linecap="round"/><text class="t c" x="456" y="397">21 番ピン（GP16）</text><path d="M119 319 L119 427 L300 427" fill="none" stroke="#E24B4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="113" y="289" width="12" height="30" rx="2" fill="#444441"/><rect x="300" y="413" width="76" height="28" rx="6" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/><text class="th m c" x="338" y="427">1 VCC</text><line x1="376" y1="427" x2="440" y2="427" stroke="#E24B4A" stroke-width="3" stroke-linecap="round"/><text class="t c" x="456" y="427">36 番ピン（3V3(OUT)）</text></svg>
