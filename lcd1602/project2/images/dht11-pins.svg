<svg xmlns="http://www.w3.org/2000/svg" width="680" height="390" viewBox="0 0 680 390" role="img"><title>DHT11 のピンと Pico W 側の接続先</title><desc>穴の開いた面を手前、ピンを下にして見た DHT11。4 本のピンは左から 1 番（VCC）、2 番（DATA）、3 番（NC）、4 番（GND）。1、2、4 番にワイヤーの穴側をかぶせ、それぞれ Pico W の 36 番ピン（3V3(OUT)）、21 番ピン（GP16）、23 番ピン（GND）につなぐ。3 番には何もつながない。黒い四角はワイヤーの穴側（メス）。穴の並びは模式的</desc><style>text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif;fill:#2C2C2A}.t{font-size:14px}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600}.c{dominant-baseline:central}.m{text-anchor:middle}</style><rect x="0.5" y="0.5" width="679" height="389" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/><text class="ts c" x="40" y="24">DHT11（穴の開いた面を手前に、ピンを下にして見た図）</text><rect x="70" y="44" width="200" height="140" rx="6" fill="#85B7EB" stroke="#378ADD" stroke-width="1.5"/><rect x="98" y="68" width="14" height="14" rx="3" fill="#185FA5"/><rect x="124" y="68" width="14" height="14" rx="3" fill="#185FA5"/><rect x="150" y="68" width="14" height="14" rx="3" fill="#185FA5"/><rect x="176" y="68" width="14" height="14" rx="3" fill="#185FA5"/><rect x="202" y="68" width="14" height="14" rx="3" fill="#185FA5"/><rect x="228" y="68" width="14" height="14" rx="3" fill="#185FA5"/><rect x="98" y="94" width="14" height="14" rx="3" fill="#185FA5"/><rect x="124" y="94" width="14" height="14" rx="3" fill="#185FA5"/><rect x="150" y="94" width="14" height="14" rx="3" fill="#185FA5"/><rect x="176" y="94" width="14" height="14" rx="3" fill="#185FA5"/><rect x="202" y="94" width="14" height="14" rx="3" fill="#185FA5"/><rect x="228" y="94" width="14" height="14" rx="3" fill="#185FA5"/><rect x="98" y="120" width="14" height="14" rx="3" fill="#185FA5"/><rect x="124" y="120" width="14" height="14" rx="3" fill="#185FA5"/><rect x="150" y="120" width="14" height="14" rx="3" fill="#185FA5"/><rect x="176" y="120" width="14" height="14" rx="3" fill="#185FA5"/><rect x="202" y="120" width="14" hei