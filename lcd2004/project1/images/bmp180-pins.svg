<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" role="img"><title>BMP180 の基板のピンと Pico W 側の接続先</title><desc>GY-68 基板に載った BMP180。基板の端に VIN, GND, SCL, SDA の順にピンが並び、それぞれを Pico W の物理ピン番号のピンにつなぐ。部品の位置とピンの並びは模式的で、基板によって違うことがある</desc><style>text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif;fill:#2C2C2A}.t{font-size:14px}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600}.n{font-size:11px;fill:#B4B2A9}.mono{font-family:'SFMono-Regular',Menlo,Consolas,'Noto Sans Mono CJK JP',monospace;font-size:13px}.c{dominant-baseline:central}.m{text-anchor:middle}.e{text-anchor:end}</style><rect x="0.5" y="0.5" width="679" height="259" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/><text class="ts c" x="40" y="24">BMP180 の基板（GY-68）</text><text class="ts c" x="478" y="24">Pico W 側（物理ピン番号）</text><rect x="120" y="50" width="300" height="180" rx="10" fill="#185FA5"/><circle cx="146" cy="76" r="9" fill="#F1EFE8"/><circle cx="146" cy="204" r="9" fill="#F1EFE8"/><rect x="226" y="104" width="64" height="64" rx="4" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="2"/><circle cx="276" cy="118" r="4" fill="#444441"/><text class="mono m c" x="258" y="186" style="fill:#F1EFE8">BMP180</text><rect x="401" y="87" width="10" height="10" fill="#B4B2A9"/><text class="ts e c" x="392" y="92" style="fill:#F1EFE8">VIN</text><line x1="416" y1="92" x2="462" y2="92" stroke="#E24B4A" stroke-width="3" stroke-linecap="round"/><text class="t c" x="478" y="92">36 番ピン（3V3(OUT)）</text><rect x="401" y="119" width="10" height="10" fill="#B4B2A9"/><text class="ts e c" x="392" y="124" style="fill:#F1EFE8">GND</text><line x1="416" y1="124" x2="462" y2="124" stroke="#888780" stroke-width="3" stroke-linecap="round"/><text class="t c" x="478" y="124">8 番ピン（GND）</text><rect x="401" y="151" width="10" height="10" fill="#B4B2A9"/><text class="ts e c" x="392" y="156" style="fill:#F1EFE8">SCL</text><line x1="416" y1="156" x2="462" y2="156" stroke="#378ADD" stroke-width="3" stroke-linecap="round"/><text class="t c" x="478" y="156">7 番ピン（GP5）</text><rect x="401" y="183" width="10" height="10" fill="#B4B2A9"/><text class="ts e c" x="392" y="188" style="fill:#F1EFE8">SDA</text><line x1="416" y1="188" x2="462" y2="188" stroke="#1D9E75" stroke-width="3" stroke-linecap="round"/><text class="t c" x="478" y="188">6 番ピン（GP4）</text></svg>
