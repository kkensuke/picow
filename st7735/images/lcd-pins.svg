<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" role="img"><title>液晶の裏側のピンと Pico W 側の接続先</title><desc>液晶の裏の右端に VCC, GND, CS, RESET, A0, SDA, SCK, LED の順にピンが並び、それぞれを Pico W の上側のピンを USB 側から数えた順番の列につなぐ</desc><style>text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif;fill:#2C2C2A}.t{font-size:14px}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600}.mono{font-family:'SFMono-Regular',Menlo,Consolas,'Noto Sans Mono CJK JP',monospace;font-size:13px}.c{dominant-baseline:central}.m{text-anchor:middle}.e{text-anchor:end}</style><rect x="0.5" y="0.5" width="679" height="259" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/><text class="ts c" x="120" y="24">液晶の裏側（文字が印刷された面）</text><text class="ts c" x="478" y="24">Pico W 側（USB から数えた順番）</text><rect x="120" y="40" width="280" height="200" rx="8" fill="#A32D2D"/><circle cx="140" cy="60" r="8" fill="#F1EFE8"/><circle cx="140" cy="220" r="8" fill="#F1EFE8"/><rect x="166" y="80" width="130" height="120" rx="4" fill="#D3D1C7"/><text class="ts m c" x="231" y="140" style="fill:#444441">SD カード差込口</text><rect x="381" y="59" width="10" height="10" fill="#2C2C2A"/><text class="ts e c" x="372" y="64" style="fill:#FCEBEB">VCC</text><line x1="396" y1="64" x2="462" y2="64" stroke="#E24B4A" stroke-width="3" stroke-linecap="round"/><text class="t c" x="478" y="64">5 番目（3V3）</text><rect x="381" y="79" width="10" height="10" fill="#2C2C2A"/><text class="ts e c" x="372" y="84" style="fill:#FCEBEB">GND</text><line x1="396" y1="84" x2="462" y2="84" stroke="#888780" stroke-width="3" stroke-linecap="round"/><text class="t c" x="478" y="84">18 番目（GND）</text><rect x="381" y="99" width="10" height="10" fill="#2C2C2A"/><text class="ts e c" x="372" y="104" style="fill:#FCEBEB">CS</text><line x1="396" y1="104" x2="462" y2="104" stroke="#7F77DD" stroke-width="3" stroke-linecap="round"/><text class="t c" x="478" y="104">19 番目（GP17）</text><rect x="381" y="119" width="10" height="10" fill="#2C2C2A"/><text class="ts e c" x="372" y="124" style="fill:#FCEBEB">RESET</text><line x1="396" y1="124" x2="462" y2="124" stroke="#D85A30" stroke-width="3" stroke-linecap="round"/><text class="t c" x="478" y="124">14 番目（GP21）</text><rect x="381" y="139" width="10" height="10" fill="#2C2C2A"/><text class="ts e c" x="372" y="144" style="fill:#FCEBEB">A0</text><line x1="396" y1="144" x2="462" y2="144" stroke="#EF9F27" stroke-width="3" stroke-linecap="round"/><text class="t c" x="478" y="144">15 番目（GP20）</text><rect x="381" y="159" width="10" height="10" fill="#2C2C2A"/><text class="ts e c" x="372" y="164" style="fill:#FCEBEB">SDA</text><line x1="396" y1="164" x2="462" y2="164" stroke="#1D9E75" stroke-width="3" stroke-linecap="round"/><text class="t c" x="478" y="164">16 番目（GP19）</text><rect x="381" y="179" width="10" height="10" fill="#2C2C2A"/><text class="ts e c" x="372" y="184" style="fill:#FCEBEB">SCK</text><line x1="396" y1="184" x2="462" y2="184" stroke="#378ADD" stroke-width="3" stroke-linecap="round"/><text class="t c" x="478" y="184">17 番目（GP18）</text><rect x="381" y="199" width="10" height="10" fill="#2C2C2A"/><text class="ts e c" x="372" y="204" style="fill:#FCEBEB">LED</text><line x1="396" y1="204" x2="462" y2="204" stroke="#D4537E" stroke-width="3" stroke-linecap="round"/><text class="t c" x="478" y="204">5 番目（3V3）</text></svg>
