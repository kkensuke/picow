ss="ts c" x="226" y="370">開く</text><circle cx="300" cy="370" r="10" fill="#E6F1FB" stroke="#185FA5"/><text class="ts m c" x="300" y="370" style="fill:#0C447C;font-weight:600">3</text><text class="ts c" x="316" y="370">実行（緑）</text><circle cx="420" cy="370" r="10" fill="#E6F1FB" stroke="#185FA5"/><text class="ts m c" x="420" y="370" style="fill:#0C447C;font-weight:600">4</text><text class="ts c" x="436" y="370">停止（赤）</text><circle cx="540" cy="370" r="10" fill="#E6F1FB" stroke="#185FA5"/><text class="ts m c" x="540" y="370" style="fill:#0C447C;font-weight:600">5</text><text class="ts c" x="556" y="370">保存</text><text class="ts m c" x="340" y="404">簡略図。実際の Thonny ではアイコンの形や並びが少し異なる</text></svg>
